include: 
  - ../weather_app_api_node/docker-compose.yml
services:
  frontend:
    container_name: weather_frontend
    build:
      context: .
      target: dev
    stdin_open: true
    ports: 
      - 5173:5173
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./:/app:delegated
      - /app/node_modules/