services:
  api:
    build:
      context: ../weather_app_api_node
      dockerfile: ../weather_app_api_node/Dockerfile
      target: dev
    stdin_open: true
    ports: 
      - 8000:8000
    volumes:
      - ../weather_app_api_node/:/app
      - /app/node_modules/
    environment:
      - PORT=8000

  web:
    build:
      context: ./
      dockerfile: Dockerfile
      target: dev
    stdin_open: true
    ports: 
      - 5173:5173
    depends_on:
      - api
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./:/app:delegated
      - /app/node_modules/
    


      
